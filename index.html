<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2026 - The Best Bag Series</title>

<style>
  :root{
    --ink:#15130f;
    --card:#1e1a13;
    --card-edge:#332c1f;
    --ivory:#f3ecdc;
    --taupe:#a79a83;
    --gold:#c2a06a;
    --gold-dim:#8a7147;
    --wine:#7c2f3c;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(194,160,106,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(124,47,60,0.10), transparent 55%);
    color:var(--ivory);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    padding:56px 20px 80px;
  }

  .wrap{
    max-width:780px;
    margin:0 auto;
  }

  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.28em;
    font-size:11px;
    color:var(--gold);
    text-align:center;
    margin:0 0 14px;
  }

  h1{
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-weight:400;
    font-size:clamp(34px,6vw,54px);
    text-align:center;
    margin:0 0 8px;
    letter-spacing:.01em;
    color:var(--ivory);
  }

  .sub{
    text-align:center;
    color:var(--taupe);
    font-size:14px;
    letter-spacing:.02em;
    margin:0 0 46px;
  }

  .sub b{
    color:var(--ivory);
    font-weight:600;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:520px;
    margin:0 auto 20px;
  }

  .progress-track{
    flex:1;
    height:2px;
    background:var(--card-edge);
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    width:0%;
    transition:width .4s ease;
  }

  .progress-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--taupe);
    white-space:nowrap;
  }

  /* New: last winner and current round */
  .round-status{
    display:flex;
    align-items:stretch;
    gap:18px;
    max-width:520px;
    margin:0 auto 18px;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:3px;
  }

  .status-item{
    flex:1;
    min-width:0;
  }

  .status-label{
    display:block;
    margin-bottom:5px;
    color:var(--gold-dim);
    font-size:9px;
    letter-spacing:.15em;
    text-transform:uppercase;
  }

  .status-value{
    display:block;
    color:var(--ivory);
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-size:17px;
    line-height:1.25;
  }

  .status-divider{
    width:1px;
    background:var(--card-edge);
  }

  .program{
    position:relative;
    padding-left:38px;
  }

  .program::before{
    content:"";
    position:absolute;
    left:9px;
    top:10px;
    bottom:10px;
    width:1px;
    background:linear-gradient(to bottom, var(--gold-dim), var(--card-edge) 90%);
  }

  .round{
    position:relative;
    margin-bottom:5px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:3px;
    padding:18px 22px 20px 24px;
    transition:border-color .2s ease, background .2s ease;
  }

  .round:hover{
    border-color:var(--gold-dim);
  }

  .round.done{
    background:#211c14;
  }

  .round.done .num-dot{
    background:var(--gold);
    border-color:var(--gold);
  }

  .num-dot{
    position:absolute;
    left:-33px;
    top:24px;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--ink);
    border:1px solid var(--gold-dim);
  }

  .row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }

  .meta{
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--taupe);
  }

  .meta .rd{
    color:var(--gold);
  }

  .brand{
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-size:23px;
    margin:4px 0 14px;
    color:var(--ivory);
    letter-spacing:.01em;
  }

  .brand.tbd{
    color:var(--taupe);
    font-style:italic;
  }

  .field{
    margin-bottom:8px;
    font-size:14px;
    color:var(--ivory);
  }

  .field-label{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-right:8px;
  }

  .field-label-filled{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-right:8px;
    font-weight:600;
  }

  .placeholder{
    color:#5c5646;
    font-style:italic;
  }

  .thumb-preview{
    width:220px;
    height:220px;
    overflow:hidden;
    border:1px solid var(--card-edge);
    border-radius:2px;
    margin:10px 0 0 0;
    background:#120f0a;
  }

  .thumb-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  @media (max-width:560px){
    .round-status{
      gap:12px;
      padding:13px;
    }

    .status-value{
      font-size:15px;
    }
  }
</style>
</head>

<body>
<div class="wrap">
  <p class="eyebrow">2026</p>

  <h1>Best Designer Bag by Brands (r/handbags Favs)</h1>

  <p class="sub">
    Started <b>Mon, Aug 10</b><br>
    Last updated: <b id="lastUpdated"></b>
  </p>

  <div class="progress-row">
    <span class="progress-label" id="progressLabel">0 / 25 Completed</span>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="round-status">
    <div class="status-item">
      <span class="status-label">Last Round Winner</span>
      <span class="status-value" id="lastWinner">—</span>
    </div>

    <div class="status-divider"></div>

    <div class="status-item">
      <span class="status-label">Current Round</span>
      <span class="status-value" id="currentRound">—</span>
    </div>
  </div>

  <div class="program" id="program"></div>
</div>

<script>
const ROUNDS = [
  {n:1,  date:"Mon, Aug 10", brand:"Hermès", winner:"Lindy 26", image:'<img src="images/Hermes.webp" alt=" "> '},
  {n:2,  date:"Thu, Aug 13", brand:"Chanel", winner:"Diana-Small", image:'<img src="images/Chanel.webp" alt=" "> '},
  {n:3,  date:"Sat, Aug 15", brand:"Dior", winner:"Placeholder", image:"Image Coming Soon"},
  {n:4,  date:"Sun, Aug 16", brand:"Goyard", winner:"Placeholder", image:"Image Coming Soon"},
  {n:5,  date:"Mon, Aug 17", brand:"Gucci", winner:"Placeholder", image:"Image Coming Soon"},
  {n:6,  date:"Tue, Aug 18", brand:"Fendi", winner:"Placeholder", image:"Image Coming Soon"},
  {n:7,  date:"Wed, Aug 19", brand:"Celine", winner:"Placeholder", image:"Image Coming Soon"},
  {n:8,  date:"Thu, Aug 20", brand:"Prada", winner:"Placeholder", image:"Image Coming Soon"},
  {n:9,  date:"Fri, Aug 21", brand:"Bottega Veneta", winner:"Placeholder", image:"Image Coming Soon"},
  {n:10, date:"Sat, Aug 22", brand:"Louis Vuitton", winner:"Placeholder", image:"Image Coming Soon"},
  {n:11, date:"Sun, Aug 23", brand:"The Row", winner:"Placeholder", image:"Image Coming Soon"},
  {n:12, date:"Mon, Aug 24", brand:"Ferragamo", winner:"Placeholder", image:"Image Coming Soon"},
  {n:13, date:"Tue, Aug 25", brand:"Miu Miu", winner:"Placeholder", image:"Image Coming Soon"},
  {n:14, date:"Wed, Aug 26", brand:"YSL", winner:"Placeholder", image:"Image Coming Soon"},
  {n:15, date:"Thu, Aug 27", brand:"Loewe", winner:"Placeholder", image:"Image Coming Soon"},
  {n:16, date:"Fri, Aug 28", brand:"Chloé", winner:"Placeholder", image:"Image Coming Soon"},
  {n:17, date:"Sat, Aug 29", brand:"Tod's", winner:"Placeholder", image:"Image Coming Soon"},
  {n:18, date:"Sun, Aug 30", brand:"Coach", winner:"Placeholder", image:"Image Coming Soon"},
  {n:19, date:"Mon, Aug 31", brand:"Polene", winner:"Placeholder", image:"Image Coming Soon"},
  {n:20, date:"Tue, Sep 1", brand:"Mulberry", winner:"Placeholder", image:"Image Coming Soon"},
  {n:21, date:"Wed, Sep 2", brand:"Strathberry", winner:"Placeholder", image:"Image Coming Soon"},
  {n:22, date:"Thu, Sep 3", brand:"Delvaux", winner:"Placeholder", image:"Image Coming Soon"},
  {n:23, date:"Fri, Sep 4", brand:"Acne Studios", winner:"Placeholder", image:"Image Coming Soon"},
  {n:24, date:"Sat, Sep 5", brand:"Songmont", winner:"Placeholder", image:"Image Coming Soon"},
  {n:25, date:"Sun, Sep 6", brand:"Givenchy", winner:"Placeholder", image:"Image Coming Soon"}
];

const program = document.getElementById("program");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const lastWinner = document.getElementById("lastWinner");
const currentRound = document.getElementById("currentRound");

function isFilled(value){
  const v = String(value || "").trim();
  return v && v !== "Placeholder";
}

function updateProgress(){
  const filled = ROUNDS.filter(r => isFilled(r.winner)).length;

  progressLabel.textContent = `${filled} / ${ROUNDS.length} Completed`;
  progressFill.style.width = `${(filled / ROUNDS.length) * 100}%`;
}

function updateRoundStatus(){
  const completedRounds = ROUNDS.filter(r => isFilled(r.winner));
  const nextRound = ROUNDS.find(r => !isFilled(r.winner));

  if(completedRounds.length > 0){
    const latestCompleted = completedRounds[completedRounds.length - 1];

    lastWinner.textContent =
      `Round ${latestCompleted.n}: ${latestCompleted.brand} — ${latestCompleted.winner}`;
  } else {
    lastWinner.textContent = "No winner yet";
  }

  if(nextRound){
    currentRound.textContent =
      `Round ${nextRound.n}: ${nextRound.brand}`;
  } else {
    currentRound.textContent = "Series complete";
  }
}

function buildRow(r){
  const div = document.createElement("div");

  div.className = "round";
  div.id = "round-" + r.n;

  div.innerHTML = `
    <span class="num-dot"></span>

    <div class="row-top">
      <span class="meta">
        <span class="rd">Round ${r.n}</span> · ${r.date}
      </span>
    </div>

    <div class="brand ${r.tbd ? "tbd" : ""}">
      ${r.brand}
    </div>

    <div class="field">
      <span class="field-label">Winner</span>
      <span class="field-label-filled">${r.winner}</span>
    </div>

    <div class="thumb-preview">
      ${r.image}
    </div>
  `;

  if(isFilled(r.winner)){
    div.classList.add("done");
  }

  return div;
}

function updateLastUpdated(){
  const lastUpdatedEl = document.getElementById("lastUpdated");
  const now = new Date();

  lastUpdatedEl.textContent = now.toLocaleDateString("en-US", {
    weekday:"short",
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function init(){
  ROUNDS.forEach(r => program.appendChild(buildRow(r)));

  updateProgress();
  updateRoundStatus();
  updateLastUpdated();
}

init();
</script>
</body>
</html>
