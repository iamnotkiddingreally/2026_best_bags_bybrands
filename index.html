<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 - The Best Bag Series</title>

<style>
  :root{
    --ink:#15130f;
    --card:#1e1a13;
    --card-edge:#332c1f;
    --ivory:#f3ecdc;
    --taupe:#a79a83;
    --gold:#c2a06a;
    --gold-dim:#8a7147;
    --wine:#7c2f3c;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(194,160,106,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(124,47,60,0.10), transparent 55%);
    color:var(--ivory);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    padding:56px 20px 80px;
  }

  .wrap{
    max-width:780px;
    margin:0 auto;
  }

  .eyebrow{
    margin:0 0 14px;
    color:var(--gold);
    font-size:11px;
    letter-spacing:.28em;
    text-align:center;
    text-transform:uppercase;
  }

  h1{
    margin:0 0 8px;
    color:var(--ivory);
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-size:clamp(34px,6vw,54px);
    font-weight:400;
    letter-spacing:.01em;
    text-align:center;
  }

  .sub{
    margin:0 0 46px;
    color:var(--taupe);
    font-size:14px;
    letter-spacing:.02em;
    text-align:center;
  }

  .sub b{
    color:var(--ivory);
    font-weight:600;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:520px;
    margin:0 auto 20px;
  }

  .progress-track{
    position:relative;
    flex:1;
    height:2px;
    overflow:hidden;
    background:var(--card-edge);
    border-radius:2px;
  }

  .progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    transition:width .4s ease;
  }

  .progress-label{
    color:var(--taupe);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  /* Status card: current round on top, last winner below */
  .round-status{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:520px;
    margin:0 auto 18px;
    padding:16px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:3px;
  }

  .status-item{
    min-width:0;
  }

  .current-status{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .last-status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .last-status-copy{
    display:flex;
    flex:1;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }

  .status-label{
    display:block;
    margin-bottom:5px;
    color:var(--gold-dim);
    font-size:9px;
    letter-spacing:.15em;
    text-transform:uppercase;
  }

  .status-value{
    display:block;
    color:var(--ivory);
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-size:17px;
    line-height:1.25;
  }

  .status-divider{
    width:100%;
    height:1px;
    background:var(--card-edge);
  }

  .last-winner-image{
    flex:0 0 72px;
    width:72px;
    height:72px;
    overflow:hidden;
    background:#120f0a;
    border:1px solid var(--card-edge);
    border-radius:2px;
  }

  .last-winner-image img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .last-winner-image:empty{
    display:none;
  }

  /* Timeline */
  .program{
    position:relative;
    padding-left:38px;
  }

  .program::before{
    position:absolute;
    top:10px;
    bottom:10px;
    left:9px;
    width:1px;
    background:linear-gradient(to bottom, var(--gold-dim), var(--card-edge) 90%);
    content:"";
  }

  .round{
    position:relative;
    margin-bottom:5px;
    padding:18px 22px 20px 24px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:3px;
    transition:border-color .2s ease, background .2s ease;
  }

  .round:hover{
    border-color:var(--gold-dim);
  }

  .round.done{
    background:#211c14;
  }

  .round.done .num-dot{
    background:var(--gold);
    border-color:var(--gold);
  }

  .num-dot{
    position:absolute;
    top:24px;
    left:-33px;
    width:11px;
    height:11px;
    background:var(--ink);
    border:1px solid var(--gold-dim);
    border-radius:50%;
  }

  .row-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  .meta{
    color:var(--taupe);
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  .meta .rd{
    color:var(--gold);
  }

  .brand{
    margin:4px 0 14px;
    color:var(--ivory);
    font-family:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    font-size:23px;
    letter-spacing:.01em;
  }

  .brand.tbd{
    color:var(--taupe);
    font-style:italic;
  }

  .field{
    margin-bottom:8px;
    color:var(--ivory);
    font-size:14px;
  }

  .field-label{
    margin-right:8px;
    color:var(--gold-dim);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }

  .field-label-filled{
    margin-right:8px;
    color:var(--gold-dim);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
  }

  .placeholder{
    color:#5c5646;
    font-style:italic;
  }

  .thumb-preview{
    width:220px;
    height:220px;
    margin:10px 0 0;
    overflow:hidden;
    background:#120f0a;
    border:1px solid var(--card-edge);
    border-radius:2px;
  }

  .thumb-preview img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  @media (max-width:560px){
    body{
      padding:42px 16px 60px;
    }

    .progress-row{
      align-items:flex-start;
      flex-direction:column;
      gap:8px;
    }

    .progress-track{
      width:100%;
    }

    .round-status{
      gap:12px;
      padding:13px;
    }

    .status-value{
      font-size:15px;
    }

    .last-winner-image{
      flex-basis:62px;
      width:62px;
      height:62px;
    }
  }
</style>
</head>

<body>
<div class="wrap">
  <p class="eyebrow">2026</p>

  <h1>Best Designer Bag by Brands (r/handbags Favs)</h1>

  <p class="sub">
    Started <b>Mon, Aug 10</b><br>
    Last updated: <b id="lastUpdated"></b>
  </p>

  <div class="progress-row">
    <span class="progress-label" id="progressLabel">0 / 25 Completed</span>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="round-status">
    <div class="status-item current-status">
      <span class="status-label">Current Round</span>
      <span class="status-value" id="currentRound">—</span>
    </div>

    <div class="status-divider"></div>

    <div class="status-item last-status">
      <div class="last-status-copy">
        <span class="status-label">Last Round Winner</span>
        <span class="status-value" id="lastWinner">—</span>
      </div>

      <div class="last-winner-image" id="lastWinnerImage"></div>
    </div>
  </div>

  <div class="program" id="program"></div>
</div>

<script>

  {

    date:"Sun, Sep 6",
    brand:"Givenchy",
    winner:"Placeholder",
    image:"Image Coming Soon"
  }
];

const program = document.getElementById("program");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const currentRound = document.getElementById("currentRound");
const lastWinner = document.getElementById("lastWinner");
const lastWinnerImage = document.getElementById("lastWinnerImage");

function isFilled(value){
  const v = String(value || "").trim();
  return v && v !== "Placeholder";
}

function updateProgress(){
  const filled = ROUNDS.filter(r => isFilled(r.winner)).length;

  progressLabel.textContent = `${filled} / ${ROUNDS.length} Completed`;
  progressFill.style.width = `${(filled / ROUNDS.length) * 100}%`;
}

function updateRoundStatus(){
  const completedRounds = ROUNDS.filter(r => isFilled(r.winner));
  const nextRound = ROUNDS.find(r => !isFilled(r.winner));

  if(nextRound){
    currentRound.textContent = `Round ${nextRound.n}: ${nextRound.brand}`;
  } else {
    currentRound.textContent = "Series complete";
  }

  if(completedRounds.length > 0){
    const latestCompleted = completedRounds[completedRounds.length - 1];

    lastWinner.textContent =
      `Round ${latestCompleted.n}: ${latestCompleted.brand} — ${latestCompleted.winner}`;

    if(String(latestCompleted.image).includes("<img")){
      lastWinnerImage.innerHTML = latestCompleted.image;
    } else {
      lastWinnerImage.innerHTML = "";
    }
  } else {
    lastWinner.textContent = "No winner yet";
    lastWinnerImage.innerHTML = "";
  }
}

function buildRow(r){
  const div = document.createElement("div");

  div.className = "round";
  div.id = "round-" + r.n;

  div.innerHTML = `
    <span class="num-dot"></span>

    <div class="row-top">
      <span class="meta">
        <span class="rd">Round ${r.n}</span> · ${r.date}
      </span>
    </div>

    <div class="brand ${r.tbd ? "tbd" : ""}">${r.brand}</div>

    <div class="field">
      <span class="field-label">Winner</span>
      <span class="field-label-filled">${r.winner}</span>
    </div>

    <div class="thumb-preview">
      ${r.image}
    </div>
  `;

  if(isFilled(r.winner)){
    div.classList.add("done");
  }

  return div;
}

function updateLastUpdated(){
  const lastUpdatedEl = document.getElementById("lastUpdated");
  const now = new Date();

  lastUpdatedEl.textContent = now.toLocaleDateString("en-US", {
    weekday:"short",
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function init(){
  ROUNDS.forEach(r => {
    program.appendChild(buildRow(r));
  });

  updateProgress();
  updateRoundStatus();
  updateLastUpdated();
}

init();
</script>
</body>
</html>
